version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aglome-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aglome_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Back
    container_name: aglome-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Back/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_NAME=aglome_db
      - DB_USER=postgres
      - DB_PASS=password
    volumes:
      - ./Back:/app/Back   # monta tu código fuente
      - ./media:/app/media
    depends_on:
      - db

  frontend:
    build: ./Front
    container_name: aglome-frontend
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    volumes:
      - ./Front:/app
      - /app/node_modules

volumes:
  postgres_data: